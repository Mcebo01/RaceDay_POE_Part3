version: '3.8'

services:
  raceday-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: raceday-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourSecurePassword123!
    ports:
      - "1433:1433"
    networks:
      - raceday-network

  raceday-api:
    build:
      context: ./RaceDay_API
      dockerfile: Dockerfile
    container_name: raceday-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=raceday-db;Database=RaceDayDb;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;
    ports:
      - "5000:8080"
    depends_on:
      - raceday-db
    networks:
      - raceday-network

  raceday-mvc:
    build:
      context: ./RaceDay_MVC
      dockerfile: Dockerfile
    container_name: raceday-mvc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5001:8080"
    depends_on:
      - raceday-api
    networks:
      - raceday-network

networks:
  raceday-network:
    driver: bridge